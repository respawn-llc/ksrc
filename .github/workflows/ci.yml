name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read version
        run: |
          echo "KSRC_VERSION=$(tr -d ' \n' < VERSION)" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "27"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: current
          cache-provider: enhanced

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Lint
        run: |
          ./scripts/ci-format.sh
          go vet ./...

      - name: Build
        run: |
          go build ./...
          ./scripts/build.sh

      - name: Test
        run: go test ./...

  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "27"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install ripgrep
        shell: pwsh
        run: |
          choco install ripgrep --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "ripgrep installation failed" }

      - name: Test platform-independent packages
        shell: pwsh
        run: |
          go test ./internal/cat ./internal/resolve ./internal/executil ./internal/adapter ./internal/cache
          if ($LASTEXITCODE -ne 0) { throw "Windows package tests failed" }
          go test ./internal/search
          if ($LASTEXITCODE -ne 0) { throw "Windows search argument tests failed" }
          go test ./internal/gradle -run 'Test(FindGradle|WriteInitScript|InitScriptMatchesGolden)'
          if ($LASTEXITCODE -ne 0) { throw "Windows Gradle regression tests failed" }
          go test ./internal/cli -run 'Test(Clean|SourceReading|.*AndroidPlatform|CatUsesFileIDCacheWithoutRediscoveringSDK)'
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI regression tests failed" }
          go test ./internal/mcpserver -run 'Test.*Platform'
          if ($LASTEXITCODE -ne 0) { throw "Windows Android MCP tests failed" }

      - name: Test Windows installation and core workflows
        shell: pwsh
        run: ./scripts/windows-smoke.ps1

  smoke-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read version
        run: |
          echo "KSRC_VERSION=$(tr -d ' \n' < VERSION)" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "27"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: current
          cache-provider: enhanced

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Build ksrc binary
        run: ./scripts/build.sh

      - name: Smoke test against sample project
        run: ./bin/ksrc search LocalDate --module org.jetbrains.kotlinx:kotlinx-datetime --project ./sample
